<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="favSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="favGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
  </defs>

  <!-- Circular background badge -->
  <rect width="64" height="64" rx="14" fill="#064E3B" />
  
  <!-- Rising Sun Arc -->
  <path d="M19 28 A13 13 0 0 1 45 28 Z" fill="url(#favSun)" />
  
  <!-- Sun Rays -->
  <path d="M32 10 L32 14" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round" />
  <path d="M20 14 L22.5 17.5" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round" />
  <path d="M44 14 L41.5 17.5" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round" />

  <!-- Solar Grid -->
  <g transform="translate(14, 30)">
    <polygon points="2,2 17,2 15,16 0,16" fill="#10B981" />
    <line x1="9.5" y1="2" x2="7.5" y2="16" stroke="#FFFFFF" stroke-width="0.8" opacity="0.7" />
    <line x1="1" y1="9" x2="16" y2="9" stroke="#FFFFFF" stroke-width="0.8" opacity="0.7" />

    <polygon points="19,2 34,2 36,16 21,16" fill="#10B981" />
    <line x1="26.5" y1="2" x2="28.5" y2="16" stroke="#FFFFFF" stroke-width="0.8" opacity="0.7" />
    <line x1="20" y1="9" x2="35" y2="9" stroke="#FFFFFF" stroke-width="0.8" opacity="0.7" />
  </g>

  <!-- Green leaf flourish -->
  <path d="M8 36 C8 50, 20 57, 34 57 C45 57, 53 50, 55 41 C51 46, 42 50, 33 50 C21 50, 14 43, 11 36 Z" fill="#34D399" />
</svg>
